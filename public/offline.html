<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <title>Sin conexión — Cotizador Sotomayor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #09090b;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background-color: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 4px;
        padding: 28px 24px;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        margin: 0 auto 16px;
        display: block;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #fbbf24;
        background-color: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.25);
        border-radius: 4px;
        padding: 4px 10px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
      }
      p {
        margin: 0 0 22px;
        font-size: 13.5px;
        line-height: 1.5;
        color: #94a3b8;
      }
      button {
        width: 100%;
        height: 44px;
        border: 1px solid #059669;
        border-radius: 4px;
        background-color: #10b981;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }
      button:hover {
        background-color: #059669;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Cotizador Sotomayor" class="logo" />
      <div class="badge">Sin Red</div>
      <h1>Sin conexión a internet</h1>
      <p>
        Verifica tu conexión Wi-Fi o datos móviles para sincronizar precios, inventario y tasas en tiempo real.
      </p>
      <button type="button" onclick="window.location.reload()">
        Reintentar conexión
      </button>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
